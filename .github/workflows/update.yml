name: 更新数据观察门户
on:
  workflow_dispatch:
  schedule:
    # UTC 01:15 = 北京时间工作日 09:15；每天只运行一次，GitHub 可能延迟
    - cron: '15 1 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: margin-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 获取两融数据（分页串行、请求间隔）
        shell: bash
        run: |
          mkdir -p data docs
          set -o pipefail
          python -u eastmoney_margin_5y_mergechatgpt.py --years 5 --output data/融资融券近五年合并分析.xlsx 2>&1 | tee run.log
      - name: 模块之间等待（低频顺序运行）
        run: sleep 20
      - name: 获取预设指数估值（每只指数串行间隔）
        run: python valuation/fetch.py --config valuation/indexes.json --output data/valuation.json
      - name: 模块之间等待（低频顺序运行）
        run: sleep 20
      - name: 获取巴菲特指标（接口全量一次）
        run: python buffett/fetch.py --output data/buffett.json --csv data/buffett_indicator_data.csv --years 10
      - name: 生成三个数据页面与门户
        run: |
          python build_site.py --input data/融资融券近五年合并分析.xlsx --output docs/margin.html
          python valuation/build.py --input data/valuation.json --output docs/valuation.html
          python buffett/build.py --input data/buffett.json --output docs/buffett.html
          python build_portal.py --input portal_template.html --output docs/index.html
      - name: 检查数据计算、链接和页面
        run: python -m unittest discover -s tests -v
      - name: 上传数据与日志（90 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-run-${{ github.run_id }}
          path: |
            data/*.xlsx
            data/buffett.json
            data/buffett_indicator_data.csv
            data/valuation.json
            run.log
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
